name: astrbot_plugin_img_curator
display_name: Femboy Detector 收藏
author: local
author_url: ""
desc: 使用 laiyoi/femboydetector DINOv2 三分类 ONNX 模型收藏群图片/短视频；自动解析合并聊天记录；提供本地网页浏览、纠正标签、按用户筛选和导出训练集。无云端视觉 API、无 PyTorch。
short_desc: DINOv2 三分类收藏 + 合并记录 + 本地审核网页。
repo: ""
category: 娱乐
tags:
  - 图片
  - 收藏
  - ONNX
  - DINOv2
  - 本地模型
  - 群聊
  - 人工审核
help: |
  /imgfilter status          状态、模型、Web UI 地址
  /imgfilter model [load]    查看/加载 laiyoi/femboydetector
  /imgfilter stats           统计
  /imgfilter pending         查看缓存
  /imgfilter pause|resume    暂停/恢复
  /imgfilter test            测试当前图片/视频（不保存）
  /imgfilter confirm|reject <ID前缀>

  群图片、视频和合并聊天记录会自动处理；私聊处理合并记录。
  在 AstrBot 管理界面的插件“可视化视图”中浏览、纠正标签、按用户导出。
version: 2.0.0
support_platforms:
  - aiocqhttp
astrbot_version: ">=4.24.1"
